- name: install dnf plugin manager
  become: true
  dnf:
    update_cache: yes
    name: dnf-plugins-core
    state: latest
  tags:
    - tools

- name: install tools
  become: true
  dnf:
    update_cache: yes
    name: "{{ packages }}"
    state: latest
  vars:
    packages:
      - ripgrep
      - fzf
      - tree
      - bat
      - tmux
  tags:
    - tools
