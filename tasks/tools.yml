- name: remove group/other write permission from /opt/homebrew/share
  file:
    path: /opt/homebrew/share
    mode: "go-w"
  tags:
    - tools

- name: install tools
  community.general.homebrew:
    name: "{{ packages }}"
    state: present
    update_homebrew: true
  vars:
    packages:
      - bat
      - bash-language-server
      - fd
      - ffmpeg
      - fzf
      - fzf-tab
      - go
      - hey
      - jq
      - lua-language-server
      - neovim
      - ripgrep
      - stow
      - tmux
      - tree
      - tree-sitter-cli
      - typescript
      - typescript-language-server
      - vscode-langservers-extracted
      - zsh-completions
  tags:
    - tools
