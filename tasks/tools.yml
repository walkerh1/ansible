- name: install tools
  community.general.homebrew:
    name: "{{ packages }}"
    state: latest
    update_homebrew: true
  vars:
    packages:
      - bat
      - fd
      - ffmpeg
      - fnm
      - fzf
      - golang
      - hey
      - jq
      - neovim
      - ripgrep
      - tmux
      - tree
  tags:
    - tools
