- name: install tools
  community.general.homebrew:
    name: "{{ packages }}"
    state: present
    update_homebrew: true
  vars:
    packages:
      - bat
      - fd
      - ffmpeg
      - fzf
      - fzf-tab
      - go
      - hey
      - jq
      - lua-language-server
      - neovim
      - ripgrep
      - stow
      - tmux
      - tree
      - tree-sitter-cli
      - typescript
      - typescript-language-server
      - vscode-langservers-extracted
      - zsh-completions
  tags:
    - tools
